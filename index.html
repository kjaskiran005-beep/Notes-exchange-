<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes Exchange</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1f5f9}
#welcome{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:10}
.btn{background:#0D9488;color:#fff;border:0;padding:14px 26px;border-radius:30px;font-size:18px;font-weight:bold}
#setup{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:10;text-align:center}
#app{display:none;padding:15px;padding-bottom:80px}
.top{background:#fff;border-bottom:1px solid #ddd;padding:12px;text-align:center;font-weight:bold;position:sticky;top:0}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}
select{width:100%;padding:13px;border-radius:10px;border:1px solid #ccc;font-size:16px;margin:10px 0}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:99}
.modal>div{background:#fff;width:100%;max-height:85%;overflow:auto;border-radius:20px 20px 0 0;padding:20px}
</style></head><body>

<div id="welcome"><div style="font-size:70px">📚</div><h1 style="margin:10px 0">Your Notes,<br>Your Success</h1><p style="color:#666">PSEB Notes - Class 5 to 12<br>Free • Easy • Topper Notes</p><br><button class="btn" onclick="goSetup()">Start Learning →</button></div>

<div id="setup"><h2>Hello Topper! 👋</h2><p>Apna Board aur Class select karo</p><select id="board"><option>PSEB</option><option>CBSE</option></select><select id="cls"><option>Class 12</option><option>Class 11</option><option>Class 10</option><option>Class 5</option></select><br><button class="btn" onclick="goApp()">Continue →</button></div>

<div id="app"><div class="top">📚 Notes Exchange - <span id="showCls"></span></div><div id="list"></div></div>

<div class="modal" id="m"><div><h2 id="mt"></h2><p id="mb" style="white-space:pre-line;line-height:1.7"></p><button class="btn" style="width:100%" onclick="document.getElementById('m').style.display='none'">Close ✕</button></div></div>

<script>
let BOOK={
"Class 12":["Punjabi|Ch 1 - Punjabi Vyakaran|Punjabi Vyakaran ke main topics:\n1. Noun / Noun de prakar\n2. Verb / Kriya\n3. Paryayvachi Shabad\n\nTip: Roz 10 shabad yaad karo.","English|Ch 1 - The Last Lesson|Summary:\nFranz ko lagta hai uska last French lesson hai.\nMoral: Apni maa-boli se pyaar karo, usko halke me mat lo.","Physics|Ch 1 - Electric Charges|Coulomb's Law: F = k q1 q2 / r²\nCharge kabhi khatam nahi hota, transfer hota hai."],
"Class 11":["English|Ch 1 - The Portrait of a Lady|Dadi aur lekhak ki kahani. Pyaar aur yaadein."],
"Class 10":["Science|Ch 1 - Chemical Reactions|Chemical Equation ko balance karna seekho."],
"Class 5":["Punjabi|Ch 1 - Punjabi Path|Punjabi path padho aur naye shabad likho."]
};
function goSetup(){document.getElementById('welcome').style.display='none';document.getElementById('setup').style.display='flex'}
function goApp(){
let c=document.getElementById('cls').value;
document.getElementById('setup').style.display='none';
document.getElementById('app').style.display='block';
document.getElementById('showCls').innerText=c;
let h='';
(BOOK[c]||[]).forEach((n,i)=>{
let p=n.split('|');
h+='<div class="card"><b>'+p[0]+'</b><br><b>'+p[1]+'</b><br><br><button class="btn" style="padding:10px 18px;font-size:15px" onclick="openNote(\''+c+'\','+i+')">Read Notes →</button></div>';
});
document.getElementById('list').innerHTML=h||'<p>Notes jald aa rahe hai...</p>';
}
function openNote(c,i){
let p=BOOK[c][i].split('|');
document.getElementById('mt').innerText=p[1];
document.getElementById('mb').innerText=p[2];
document.getElementById('m').style.display='flex';
}
</script></body></html>
