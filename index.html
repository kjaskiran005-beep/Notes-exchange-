<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes Exchange</title><style>body{margin:0;background:#0A0A0A;color:#fff;font-family:sans-serif}#s{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;animation:h .5s ease 2.2s forwards}@keyframes h{to{opacity:0;visibility:hidden}}h1{font-size:26px;background:linear-gradient(90deg,#BF953F,#FCF6BA,#BF953F);-webkit-background-clip:text;-webkit-text-fill-color:transparent}header{padding:18px}header span{color:#D4AF37}.c{padding:0 14px 80px}.g{background:#151515;border:1px solid #2A2A2A;border-radius:18px;padding:14px;margin-bottom:12px}.g h3{margin:0 0 8px;color:#FFD700;font-size:14px}input,select{width:100%;padding:12px;margin:5px 0;background:#0F0F0F;border:1px solid #333;color:#fff;border-radius:10px}button{background:linear-gradient(90deg,#BF953F,#FFD700);border:none;padding:13px;width:100%;border-radius:10px;font-weight:800}.n{background:#1A1A1A;border:1px solid #2A2A2A;padding:12px;border-radius:14px;margin-top:10px}.n b{font-size:15px}.t{font-size:11px;color:#FFD700}#m{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);padding:12px;z-index:100}#m>div{background:#141414;border:1px solid #D4AF37;padding:18px;border-radius:18px;max-height:88vh;overflow:auto}.d{background:#fff;color:#000;border-radius:12px;padding:10px;margin:10px 0;text-align:center}</style></head><body><div id="s"><div style="font-size:55px">📚✨</div><h1>NOTES EXCHANGE</h1><div style="color:#888;font-size:11px;letter-spacing:2px">LUXURY • CLASS 5 TO 12 • DIAGRAM</div></div><header><h1>Welcome, <span>Topper 👑</span></h1><p style="color:#888;font-size:13px">Select Class → Chapter → Full Notes + Diagram</p></header><div class="c"><div class="g"><h3>🎯 Class + Search</h3><select id="cl" onchange="go()"><option value="">All Classes</option><option>Class 5</option><option>Class 6</option><option>Clas Bank = Gives Loan\nTOPIC 4: If Repo increases, Loan becomes expensive"},{c:"Class 5",s:"Maths",ch:"Fractions",t:"Fractions",dia:"<div class=d>🍕 Pizza 4 slices, 1 eaten = 1/4</div>",d:"TOPIC 1: Numerator on top, Denominator below\nTOPIC 2: 1/2 = Half, 1/4 = Quarter\nTOPIC 3: 1/2 + 1/2 = 1"}];function go(){let q=document.getElementById('q').value.toLowerCase(),cl=document.getElementById('cl').value,f=N.filter(x=>(!cl||x.c==cl)&&(!q||x.t.toLowerCase().includes(q)||x.ch.toLowerCase().includes(q)||x.d.toLowerCase().includes(q)));document.getElementById('ct').innerText='('+f.length+')';document.getElementById('r').innerHTML=f.map(x=>'<div class=n onclick="openN('+N.indexOf(x)+')"><span class=t>'+x.c+' • '+x.s+' • '+x.ch+'</span><br><b>'+x.t+'</b><br><small style=color:#888>Tap - Full Notes + Diagram</small></div>').join('')||'No notes found'}function openN(i){let x=N[i];document.getElementById('mt').innerText=x.t;document.getElementById('ms').innerText=x.c+' • '+x.s+' • '+x.ch;document.getElementById('mdia').innerHTML=x.dia;document.getElementById('md').innerText=x.d;document.getElementById('m').style.display='block'}go();</script></body></html>
