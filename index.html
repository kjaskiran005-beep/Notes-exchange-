let N=[];for(let b in BOOK){for(let cl in BOOK[b]){BOOK[b][cl].forEach(s=>{let parts=s.split('|');let subj=parts[0];let chs=parts[1].split(',');chs.forEach((ch,i)=>{N.push({b:b,c:cl,s:subj,ch:'Chapter '+(i+1)+' - '+ch.trim(),t:ch.trim()})})})}}
function updSub(){let cl=document.getElementById('cl').value;let su=document.getElementById('su');let set=new Set();N.forEach(x=>{if((!BOARD||x.b==BOARD)&&(!cl||x.c==cl))set.add(x.s)});su.innerHTML='<option value="">All Subjects</option>'+[...set].map(s=>'<option>'+s+'</option>').join('')}
function makeNotes(x){return 'BOARD: '+x.b+' • '+x.c+' • '+x.s+' • '+x.ch+'\n\nThis is Full Book Like Notes for '+x.t+'.\nRead it like you read your book, topic by topic.\n\nTOPIC 1: Introduction - What is '+x.t+'? - DETAILED\n'+x.t+' is an important chapter of '+x.s+' for '+x.c+' '+x.b+' Board.\nIn this chapter we learn the basic concept, definition and why this topic is important in real life and in exam.\nDefinition: '+x.t+' means the main idea of this chapter. Learn the definition word by word, it comes for 1 mark.\nExample in Real Life: Think of one example from your daily life where you use '+x.t+'. If you connect it with real life, you will never forget it.\nEXAM TIP: This introduction comes for 1-2 marks. Write definition + 1 example.\n\nTOPIC 2: Main Concept - Full Explanation - DETAILED\nThis is the most important part of the chapter.\n1. First Point: Learn the main rule / formula / process of '+x.t+'.\n2. Second Point: Understand how it works step by step.\n3. Third Point: Learn all important terms and their meanings.\nDiagram: Draw a neat diagram for '+x.t+' - Label all parts. Diagram gives 2-3 marks extra in exam.\nExample: Solve one example related to '+x.t+' yourself. Example makes concept clear.\nCommon Mistake: Students forget to write units / steps. Always write full steps.\n\nTOPIC 3: Important Points / Formulas / Types - DETAILED\nLearn all formulas, types and differences in this chapter.\nIf it is Maths / Physics: Write all formulas in a box and revise daily.\nIf it is Science: Write all differences in table form - Example: Difference between A and B.\nIf it is Economics / Social Science: Write points in bullet form - 1,2,3,4.\nIf it is Language (Punjabi / Hindi / English): Learn word meanings, summary and all question answers.\nMemory Trick: Make one short trick to remember formulas / points.\n\nTOPIC 4: NCERT / PSEB Exercise + Exam Questions - DETAILED\nQ1. What is '+x.t+'? Explain with example. [3 Marks]\nAns: Write definition + explanation + 1 example.\nQ2. Write any 3 important points of '+x.t+'? [3 Marks]\nAns: Write 3 points with 1 line explanation each.\nQ3. Diagram / Numerical / Long Question on '+x.t+'? [5 Marks]\nAns: Start with introduction, then main points, then diagram / solution, then conclusion.\n\nTOPIC 5: Revision - How To Top In Exam\n1. Read this chapter 2 times - first for understanding, second for remembering.\n2. Write all important points in your copy without seeing.\n3. Solve previous year questions of '+x.t+'.\n4. Revise diagram / formulas one day before exam.\n\nRemember: If you understand '+x.t+' like this, you can answer any question in exam.'}
function go(){let q=document.getElementById('q').value.toLowerCase(),cl=document.getElementById('cl').value,su=document.getElementById('su').value,f=N.filter(x=>(!BOARD||x.b==BOARD)&&(!cl||x.c==cl)&&(!su||x.s==su)&&(!q||x.t.toLowerCase().includes(q)||x.ch.toLowerCase().includes(q)||x.s.toLowerCase().includes(q)));document.getElementById('ct').innerText='('+f.length+' Chapters Found)';let last='';document.getElementById('r').innerHTML=f.map(x=>{let h='';let key=x.c+' • '+x.s;if(key!==last){h='<div class=sec>'+x.b+' • '+key+'</div>';last=key}return h+'<div class=n onclick="openN('+N.indexOf(x)+')"><span class=t>'+x.ch+'</span> <span class=badge>'+x.b+'</span><br><b>'+x.t+'</b><br><small style=color:#888>Tap - Full Book Like Notes - Auto Generated</small></div>'}).join('')||'No chapter found. Select Board / Class.'}function openN(i){let x=N[i];document.getElementById('mt').innerText=x.t;document.getElementById('ms').innerText=x.b+' • '+x.c+' • '+x.s+' • '+x.ch;document.getElementById('mdia').innerHTML='<div class=d>📖 '+x.t+'<br>'+x.b+' • '+x.c+' • '+x.s+'<br>Diagram + Formula + Explanation Inside</div>';document.getElementById('md').innerText=makeNotes(x);document.getElementById('m').style.display='block'}updSub();go();</script></body></html>
