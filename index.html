<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes Exchange</title><style>body{margin:0;background:#FFF7ED;font-family:sans-serif}header{background:#FF6B35;color:#fff;padding:20px;text-align:center}.c{padding:15px;max-width:700px;margin:auto}.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:15px}input,select,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}button{background:#FF6B35;color:#fff;border:none;padding:12px;width:100%;border-radius:8px}.note{border:1px solid #FFE0CC;padding:12px;border-radius:10px;margin-top:10px;background:#FFF9F5}</style></head><body><header><h1>📚 Notes Exchange</h1><p>Class 1 to 12 - Search karke topic mil jata</p></header><div class="c"><div class="card"><h3>🔍 Notes Search Karo</h3><input id="s" value="Economics" placeholder="Jaise - Photosynthesis, Economics..."><select id="cl"><option value="">Sabhi Class</option><option>Class 5</option><option>Class 10</option><option>Class 12</option></select><button onclick="go()">Search Notes</button><div id="r"></div></div><div class="card"><h3>📤 Apne Notes Share Karo</h3><input placeholder="Tera Naam"><input placeholder="Topic Ka Naam"><textarea placeholder="Notes ke baare me likho..."></textarea><button onclick="alert('Thanks! Note mil gaya.')">Upload Notes</button></div></div><script>let n=[{t:"Economics - National Income",c:"Class 12",d:"National Income ke notes, formula ke saath."},{t:"Economics - Money and Banking",c:"Class 12",d:"Money and Banking easy language me."},{t:"Photosynthesis",c:"Class 10",d:"Photosynthesis ke notes diagram ke saath."},{t:"Maths - Trigonometry",c:"Class 10",d:"Trigonometry ke saare formulas."},{t:"Maths - Tables",c:"Class 5",d:"Tables 1 se 20 tak."}];function go(){let q=document.getElementById('s').value.toLowerCase();let cl=document.getElementById('cl').value;let f=n.filter(x=>x.t.toLowerCase().includes(q)&&(!cl||x.c==cl));document.getElementById('r').innerHTML=f.length?'<h4>✅ '+f.length+' Notes Mile:</h4>'+f.map(x=>'<div class=note><b>'+x.t+'</b><br><small>'+x.c+'</small><p>'+x.d+'</p></div>').join(''):'<p>😔 Koi note nahi mila.</p>'}go();</script></body></html>
